<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper's Ped Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<div class="container">
    <img src="images/body.svg">
    <label class="Label">Hyper's Ped Menu</label>

    <input class="Input" placeholder="PED NAME">
    <button class="ConfirmButton">CONFIRM</button>

    <div class="FeatureButtons">
        <button class="FeatureBtn GodmodeBtn" id="godmodeBtn">GODMODE</button>
        <button class="FeatureBtn InvisibleBtn" id="invisibleBtn">INVISIBLE</button>
        <button class="FeatureBtn HealBtn" id="healBtn">HEAL</button>
    </div>

    <button class="ResetButton">RESET</button>
    <button class="Exit">Exit</button>
</div>

<script src="index.js"></script>
</body>
</html>
